trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - group: freyr-sales-ci
  - name: nodeVersion
    value: '20.x'

stages:
  - stage: Verify
    jobs:
      - job: Quality
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
          - script: npm ci
            displayName: Install locked dependencies
          - script: npm run typecheck
            displayName: Type check
          - script: npm run lint
            displayName: Lint
          - script: npm audit --omit=dev --audit-level=high
            displayName: Production dependency audit
          - script: npm run build
            displayName: Production build
          - script: npx playwright install --with-deps chromium
            displayName: Install browser
          - script: npm run test:smoke
            displayName: Smoke tests
          - script: npm run test:auth
            displayName: Authentication boundary tests
          - script: npm run test:onboarding
            displayName: Onboarding tour tests
          - script: npm run test:real
            displayName: Live-mode boundary tests
          - script: npx playwright test tests/identity.spec.ts tests/personal-data-isolation.spec.ts tests/email-delivery.spec.ts --config=playwright.auth.config.ts --reporter=list
            displayName: Identity, private-data, and invitation-delivery tests
          - script: npx playwright test tests/authz-guardrails.spec.ts --config=playwright.auth.config.ts --reporter=list
            displayName: Authorization guardrail tests
          - script: npx playwright test tests/member-assignment.spec.ts --config=playwright.assignment.config.ts --reporter=list
            displayName: Stable ownership tests
          - script: npx playwright test tests/workspace-scope.spec.ts --config=playwright.workspace.config.ts --reporter=list
            displayName: Workspace isolation tests

  - stage: Deploy
    dependsOn: Verify
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildAndDeploy
        steps:
          - task: AWSShellScript@1
            displayName: Build, push, and deploy to AWS ECS
            inputs:
              awsCredentials: freyr-sales-aws
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail

                TAG=$(echo "$(Build.SourceVersion)" | cut -c1-7)
                IMAGE="$(ECR_REGISTRY)/$(ECR_REPO)"

                # Derive the application secret ARN from the live task
                # definition (the initial AWS setup registered it there). The
                # previous revision referenced an APP_SECRETS_ARN pipeline
                # variable that was never added to the freyr-sales-ci group,
                # which broke every deploy with an empty SecretId.
                APP_SECRET_ARN=$(
                  aws ecs describe-task-definition \
                    --task-definition "$(TASK_FAMILY)" \
                    --query 'taskDefinition.containerDefinitions[0].secrets[0].valueFrom' \
                    --output text 2>/dev/null \
                  | sed -E 's/:[^:]*::$//' || true
                )
                if [ -z "$APP_SECRET_ARN" ] || [ "$APP_SECRET_ARN" = "None" ]; then
                  echo "Deployment blocked: could not derive the application secret ARN from the $(TASK_FAMILY) task definition."
                  echo "Attach the Secrets Manager secret to the task definition once, or add APP_SECRETS_ARN to the freyr-sales-ci variable group."
                  exit 1
                fi
                echo "Using application secret: $APP_SECRET_ARN"

                REQUIRED_SECRET_KEYS='[
                  "NEXT_PUBLIC_SUPABASE_URL",
                  "NEXT_PUBLIC_SUPABASE_ANON_KEY",
                  "SUPABASE_SERVICE_ROLE_KEY",
                  "AUTH_COOKIE_SECRET",
                  "OWNER_EMAILS",
                  "FREYR_WORKSPACE_ID",
                  "RESEND_API_KEY"
                ]'
                MISSING_SECRET_KEYS=$(
                  aws secretsmanager get-secret-value \
                    --secret-id "$APP_SECRET_ARN" \
                    --query SecretString \
                    --output text \
                  | jq -r --argjson required "$REQUIRED_SECRET_KEYS" '
                      if type != "object" then
                        error("Application SecretString must be a JSON object")
                      else
                        . as $secret
                        | $required[]
                        | . as $key
                        | select(($secret | has($key)) | not)
                      end
                    '
                )
                if [ -n "$MISSING_SECRET_KEYS" ]; then
                  echo "Deployment blocked: application secret is missing required JSON keys:"
                  while IFS= read -r key; do
                    echo " - $key"
                  done <<< "$MISSING_SECRET_KEYS"
                  exit 1
                fi
                echo "Verified required application secret keys are present."

                aws ecr get-login-password --region "$(AWS_REGION)" \
                  | docker login --username AWS --password-stdin "$(ECR_REGISTRY)"

                docker build --platform linux/amd64 \
                  --build-arg NEXT_PUBLIC_SUPABASE_URL="$(NEXT_PUBLIC_SUPABASE_URL)" \
                  --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$(NEXT_PUBLIC_SUPABASE_ANON_KEY)" \
                  -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
                docker push "$IMAGE:$TAG"
                docker push "$IMAGE:latest"

                TD=$(aws ecs describe-task-definition \
                  --task-definition "$(TASK_FAMILY)" \
                  --query taskDefinition \
                  --output json)

                echo "$TD" | jq \
                  --arg IMG "$IMAGE:$TAG" \
                  --arg VER "$(Build.SourceVersion)" \
                  --arg SECRET_ARN "$APP_SECRET_ARN" '
                  def set_env($name; $value):
                    .containerDefinitions[0].environment = (
                      ((.containerDefinitions[0].environment // [])
                        | map(select(.name != $name)))
                      + [{name: $name, value: $value}]
                    );
                  def set_secret($name; $json_key):
                    .containerDefinitions[0].secrets = (
                      ((.containerDefinitions[0].secrets // [])
                        | map(select(.name != $name)))
                      + [{
                          name: $name,
                          valueFrom: ($SECRET_ARN + ":" + $json_key + "::")
                        }]
                    );
                  .containerDefinitions[0].image = $IMG
                  | set_env("APP_VERSION"; $VER)
                  | set_secret("NEXT_PUBLIC_SUPABASE_URL"; "NEXT_PUBLIC_SUPABASE_URL")
                  | set_secret("NEXT_PUBLIC_SUPABASE_ANON_KEY"; "NEXT_PUBLIC_SUPABASE_ANON_KEY")
                  | set_secret("SUPABASE_SERVICE_ROLE_KEY"; "SUPABASE_SERVICE_ROLE_KEY")
                  | set_secret("AUTH_COOKIE_SECRET"; "AUTH_COOKIE_SECRET")
                  | set_secret("OWNER_EMAILS"; "OWNER_EMAILS")
                  | set_secret("FREYR_WORKSPACE_ID"; "FREYR_WORKSPACE_ID")
                  | set_secret("RESEND_API_KEY"; "RESEND_API_KEY")
                  | set_env("AUTH_MODE"; "supabase")
                  | set_env("AUTH_PUBLIC_ORIGIN"; "https://freyrsales.dev.freyrapps.com")
                  | set_env("ACCESS_CONTROL_MODE"; "approval")
                  | set_env("DEFAULT_DATA_MODE"; "mock")
                  | set_env("DATA_MODE_LOCKED"; "0")
                  | del(
                      .taskDefinitionArn,
                      .revision,
                      .status,
                      .requiresAttributes,
                      .compatibilities,
                      .registeredAt,
                      .registeredBy
                    )
                ' > taskdef.json

                REV=$(aws ecs register-task-definition \
                  --cli-input-json file://taskdef.json \
                  --query taskDefinition.revision \
                  --output text)

                aws ecs update-service \
                  --cluster "$(ECS_CLUSTER)" \
                  --service "$(ECS_SERVICE)" \
                  --task-definition "$(TASK_FAMILY):$REV" \
                  --force-new-deployment

                aws ecs wait services-stable \
                  --cluster "$(ECS_CLUSTER)" \
                  --services "$(ECS_SERVICE)"
